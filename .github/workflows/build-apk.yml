# GitHub only runs workflows located in .github/workflows/.
# In GitHub: Add file > Create new file, type the name  .github/workflows/build-apk.yml  and paste this content.
name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StreamTV-apk
          path: build/outputs/apk/debug/*.apk
      - name: Publish release (used by the in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Stream TV b${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
